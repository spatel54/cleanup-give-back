# status values:
#   designed     — screen exists in Figma; not yet built as native RN
#   bound        — design tokens fully applied in Figma; ready for RN implementation
#   implemented  — native RN screen shipped in src/app/; legacy HTML route can be removed
#   missing      — no Figma frame found anywhere in the file as of 2026-08-09 audit; needs net-new design
#
# legacyHtmlKey — the HTML_MAP key in frontend/src/app/prototype/[screen].tsx (migration reference only)
# figmaNode     — Figma node-id. "NEEDS-VISUAL-VERIFICATION" means a candidate frame exists but the exact
#                 routeKey<->node assignment could not be confirmed from names/structure alone — see
#                 gap-worklist-2026-08-09.md for the candidate list each Phase 3 section agent must resolve
#                 with screenshots before binding.
#
